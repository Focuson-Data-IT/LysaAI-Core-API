name: CI/CD LysaAI - Staging

on:
  push:
    branches:
      - DEV

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: kevinirawand/lysaai-core-fe
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          NEXT_PUBLIC_OUTPUT: ${{ secrets.STAGING_OUTPUT }}
          NEXT_PUBLIC_HOST: ${{ secrets.STAGING_HOST }}
          NEXT_PUBLIC_ASSET_PREFIX: ${{ secrets.STAGING_ASSET_PREFIX }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.STAGING_BASE_PATH }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ~/LysaAI-Core-FE/
            git reset --hard HEAD
            git pull origin DEV
            docker-compose down
            docker-compose pull
            docker-compose up -d
            docker system prune -f